databaseChangeLog:
  - changeSet:
      id: 002-create-profile-visits
      author: igor.trofimov
      changes:
        - createTable:
            tableName: profile_visits
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: visitor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: visited_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: visited_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()

        - addForeignKeyConstraint:
            baseTableName: profile_visits
            baseColumnNames: visitor_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_visits_visitor
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: profile_visits
            baseColumnNames: visited_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_visits_visited
            onDelete: CASCADE

        - createIndex:
            indexName: idx_visits_visited_time
            tableName: profile_visits
            columns:
              - column:
                  name: visited_id
              - column:
                  name: visited_at

        - createIndex:
            indexName: idx_visits_visitor_time
            tableName: profile_visits
            columns:
              - column:
                  name: visitor_id
              - column:
                  name: visited_at