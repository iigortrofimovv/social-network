databaseChangeLog:
  - changeSet:
      id: 003-create-profile-likes
      author: igor.trofimov
      changes:
        - createTable:
            tableName: profile_likes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: liked_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: liked_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()

        - addUniqueConstraint:
            tableName: profile_likes
            columnNames: user_id, liked_user_id
            constraintName: uq_user_like

        - addForeignKeyConstraint:
            baseTableName: profile_likes
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_likes_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: profile_likes
            baseColumnNames: liked_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_likes_liked_user
            onDelete: CASCADE

        - createIndex:
            indexName: idx_likes_user_time
            tableName: profile_likes
            columns:
              - column:
                  name: user_id
              - column:
                  name: liked_at